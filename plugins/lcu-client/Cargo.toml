[package]
name = "tauri-plugin-lcu-client"
version = "0.0.0"
authors = [ "You" ]
description = ""
edition = "2021"
rust-version = "1.70"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-lcu-client"

[dependencies]
tauri = { version = "2.0.0-beta.22" }
serde = "1.0"
thiserror = "1.0"
shaco = "0.6.0"
tokio = { version = "1.36.0", features = ["full"] }
serde_json = "1"
futures-util = "0.3.30"


[build-dependencies]
tauri-plugin = { version = "2.0.0-beta.17", features = ["build"] }
