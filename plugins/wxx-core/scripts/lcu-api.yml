matchmaking:
  lol-matchmaking/v1:
    ready-check:
      accept: post => ReadyCheck;
      decline: post => ReadyCheck;
    search:
      $self: get => GetSearch

lobby:
  lol-lobby/v2:
    play-again: post
    lobby:
      $self: get => Lobby[]
      matchmaking/search:
        - post
        - delete
      members:
        $self: get => LobbyMember[]
        ${id:string|number}:
          promote: post => number
          kick: post => number

gameflow:
  lol-gameflow/v1:
    gameflow-phase: get => GameflowPhase
    session: get => GameflowPhase
    early-exit: post
