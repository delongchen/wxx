[package]
name = "tauri-plugin-wxx-core"
version = "0.0.0"
authors = [ "You" ]
description = ""
edition = "2021"
rust-version = "1.70"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-wxx-core"

[dependencies]
tauri = { version = "2.0.0-beta.22" }
serde = "1.0"
thiserror = "1.0"
shaco = "0.6.0"
tokio = { version = "1.38.1", features = ["full"] }
serde_json = "1"
futures-util = "0.3.30"
log = "0.4.21"
base64 = "0.22.1"
reqwest = "0.12.5"
native-tls = "0.2.12"
tokio-tungstenite = { version = "0.23.1", features = ["native-tls"] }

[dev-dependencies]
tokio = "1.38.1"

[dependencies.sysinfo]
version = "0.30.12"

[build-dependencies]
tauri-plugin = { version = "2.0.0-beta.17", features = ["build"] }
